<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#111827">
  <title>DeCA Manager — Nueva contraseña</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body { background: var(--bg); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 16px; }
    .reset-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 32px 24px; max-width: 400px; width: 100%; }
    .reset-card h1 { font-size: 20px; margin: 0 0 4px; color: var(--fg); }
    .reset-card p { font-size: 14px; color: var(--fg-secondary); margin: 0 0 20px; }
    .reset-card .form-group { margin-bottom: 16px; }
    .reset-card label { display: block; font-size: 13px; font-weight: 500; color: var(--fg); margin-bottom: 4px; }
    .reset-card input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; background: var(--bg); color: var(--fg); box-sizing: border-box; }
    .reset-card .btn { width: 100%; padding: 12px; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .reset-card .btn-primary { background: #2563eb; color: #fff; }
    .reset-card .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .error-msg { color: #ef4444; font-size: 13px; margin-bottom: 12px; }
    .success-msg { color: #22c55e; font-size: 14px; text-align: center; }
    .success-msg a { color: #2563eb; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="reset-card">
    <div id="form-view">
      <h1>Nueva contraseña</h1>
      <p>Escribe tu nueva contraseña para DeCA Manager</p>
      <form id="reset-form">
        <div class="form-group">
          <label for="new-password">Nueva contraseña</label>
          <input type="password" id="new-password" required minlength="6" placeholder="Mínimo 6 caracteres">
        </div>
        <div class="form-group">
          <label for="confirm-password">Repetir contraseña</label>
          <input type="password" id="confirm-password" required minlength="6" placeholder="Repite la contraseña">
        </div>
        <div id="reset-error" class="error-msg" style="display:none;"></div>
        <button type="submit" class="btn btn-primary" id="reset-btn">Cambiar contraseña</button>
      </form>
    </div>
    <div id="success-view" style="display:none;">
      <div class="success-msg">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2" style="display:block; margin:0 auto 12px;">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
        <p style="font-size:16px; font-weight:600; color:var(--fg); margin-bottom:8px;">Contraseña actualizada</p>
        <p style="font-size:14px; color:var(--fg-secondary); margin-bottom:16px;">Ya puedes iniciar sesión con tu nueva contraseña</p>
        <a href="/">Ir al login</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
  <script>
    const SUPABASE_URL = 'https://dzotgifxgjfvpprjffow.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR6b3RnaWZ4Z2pmdnBwcmpmZm93Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwMzY3MTMsImV4cCI6MjEwODYxMjcxM30.seS6dgC3qcLxqxzBDksbgAusPXMioV60rhhG3f5ScFk';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pw = document.getElementById('new-password').value;
      const pw2 = document.getElementById('confirm-password').value;
      const errorEl = document.getElementById('reset-error');
      const btn = document.getElementById('reset-btn');

      errorEl.style.display = 'none';

      if (pw !== pw2) {
        errorEl.textContent = 'Las contraseñas no coinciden';
        errorEl.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Cambiando...';

      try {
        const { error } = await supabase.auth.updateUser({ password: pw });
        if (error) throw error;

        document.getElementById('form-view').style.display = 'none';
        document.getElementById('success-view').style.display = 'block';
      } catch (err) {
        errorEl.textContent = err.message || 'Error al cambiar la contraseña';
        errorEl.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Cambiar contraseña';
      }
    });
  </script>
</body>
</html>
