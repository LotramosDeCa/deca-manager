<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a56db">
  <title>DeCA — Descarga</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #f3f4f6;
      color: #111827;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
      padding: 40px 32px;
      text-align: center;
      max-width: 380px;
      width: 90%;
    }
    .logo {
      width: 56px; height: 56px;
      margin: 0 auto 16px;
    }
    .logo rect { fill: #1a56db; }
    .logo path { fill: white; }
    h1 { font-size: 20px; font-weight: 700; color: #111827; margin-bottom: 4px; }
    .subtitle { font-size: 13px; color: #6b7280; margin-bottom: 24px; }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid #e5e7eb;
      border-top-color: #1a56db;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status { font-size: 14px; color: #374151; font-weight: 500; }
    .status-sub { font-size: 12px; color: #9ca3af; margin-top: 4px; }

    .success-icon {
      width: 48px; height: 48px;
      background: #d1fae5;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }
    .success-icon svg { color: #059669; }

    .error-icon {
      width: 48px; height: 48px;
      background: #fee2e2;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }
    .error-icon svg { color: #dc2626; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      margin-top: 16px;
      text-decoration: none;
    }
    .btn-primary { background: #1a56db; color: white; }
    .btn-primary:active { background: #1648b8; }

    .footer {
      margin-top: 24px;
      font-size: 11px;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="card" id="content">
    <svg class="logo" viewBox="0 0 56 56" fill="none">
      <rect width="56" height="56" rx="14"/>
      <path d="M16 18h24v4H16zM16 26h24v4H16zM16 34h16v4H16zM38 30l6 8h-12z"/>
    </svg>
    <h1>DeCA Manager</h1>
    <p class="subtitle">Documento Electrónico de Control Administrativo</p>
    <div class="spinner"></div>
    <p class="status">Generando documento...</p>
    <p class="status-sub">La descarga comenzará automáticamente</p>
  </div>
  <div class="footer">Conforme a Orden TRM/282/2026</div>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
  <!-- jsPDF -->
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <!-- QRious (generador QR para navegador) -->
  <script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>

  <script>
    const SUPABASE_URL = 'https://dzotgifxgjfvpprjffow.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR6b3RnaWZ4Z2pmdnBwcmpmZm93Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwMzY3MTMsImV4cCI6MjEwODYxMjcxM30.seS6dgC3qcLxqxzBDksbgAusPXMioV60rhhG3f5ScFk';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function init() {
      const params = new URLSearchParams(window.location.search);
      const ref = params.get('ref');
      const content = document.getElementById('content');

      if (!ref) {
        showError(content, 'No se ha proporcionado una referencia de DeCA.');
        return;
      }

      try {
        const { data, error } = await sb
          .from('decas')
          .select('*')
          .eq('referencia', ref)
          .single();

        if (error || !data) {
          showError(content, 'No se encontró la DeCA: ' + ref);
          return;
        }

        // Generar y descargar PDF automáticamente
        await generarYDescargarPDF(data);
        showSuccess(content, data.referencia);
      } catch (err) {
        console.error(err);
        showError(content, 'Error al generar el documento.');
      }
    }

    function showError(container, msg) {
      container.innerHTML = `
        <svg class="logo" viewBox="0 0 56 56" fill="none">
          <rect width="56" height="56" rx="14"/><path d="M16 18h24v4H16zM16 26h24v4H16zM16 34h16v4H16zM38 30l6 8h-12z"/>
        </svg>
        <h1>DeCA Manager</h1>
        <p class="subtitle">Documento Electrónico de Control Administrativo</p>
        <div class="error-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
          </svg>
        </div>
        <p class="status" style="color:#dc2626;">${msg}</p>
      `;
    }

    function showSuccess(container, referencia) {
      container.innerHTML = `
        <svg class="logo" viewBox="0 0 56 56" fill="none">
          <rect width="56" height="56" rx="14"/><path d="M16 18h24v4H16zM16 26h24v4H16zM16 34h16v4H16zM38 30l6 8h-12z"/>
        </svg>
        <h1>DeCA Manager</h1>
        <p class="subtitle">Documento Electrónico de Control Administrativo</p>
        <div class="success-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 6L9 17l-5-5"/>
          </svg>
        </div>
        <p class="status">Documento descargado</p>
        <p class="status-sub">${referencia}</p>
        <button class="btn btn-primary" onclick="init()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Descargar otra vez
        </button>
      `;
    }

    // Datos empresa (mismos que en decas.js)
    const EMPRESA = {
      nombre: 'Lotramos SL',
      nif: 'B45849353',
      direccion: 'AV. Principe, 82 - 45692 Malpica de Tajo',
      num_autorizacion: '',
    };

    async function generarYDescargarPDF(d) {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF('p', 'mm', 'a4');
      const pw = 210;
      const m = 14;
      const cw = pw - m * 2;
      let y = 0;

      // Colores
      const PRIMARY = [26, 86, 219];
      const DARK = [30, 30, 30];
      const GRAY = [120, 120, 120];
      const LIGHT_BG = [245, 247, 252];
      const WHITE = [255, 255, 255];

      // ========== CABECERA ==========
      doc.setFillColor(...PRIMARY);
      doc.rect(0, 0, pw, 28, 'F');
      doc.setTextColor(...WHITE);
      doc.setFontSize(16);
      doc.setFont('helvetica', 'bold');
      doc.text('DOCUMENTO DE CONTROL', pw / 2, 12, { align: 'center' });
      doc.setFontSize(11);
      doc.text('Documento Electronico de Control Administrativo (DeCA)', pw / 2, 19, { align: 'center' });
      doc.setFontSize(8);
      doc.setFont('helvetica', 'normal');
      doc.text('Conforme a la Orden TRM/282/2026', pw / 2, 25, { align: 'center' });

      y = 33;

      // ========== BLOQUE EMPRESA ==========
      doc.setFillColor(...LIGHT_BG);
      doc.roundedRect(m, y, cw, 22, 2, 2, 'F');
      doc.setTextColor(...DARK);
      doc.setFontSize(12);
      doc.setFont('helvetica', 'bold');
      doc.text(EMPRESA.nombre, m + 4, y + 7);
      doc.setFontSize(9);
      doc.setFont('helvetica', 'normal');
      doc.setTextColor(...GRAY);
      doc.text('NIF: ' + EMPRESA.nif, m + 4, y + 13);
      doc.text(EMPRESA.direccion, m + 4, y + 18);
      doc.setTextColor(...DARK);
      doc.setFontSize(9);
      doc.setFont('helvetica', 'bold');
      doc.text('Ref: ' + (d.referencia || '--'), pw - m - 4, y + 7, { align: 'right' });
      doc.setFont('helvetica', 'normal');
      doc.setTextColor(...GRAY);
      doc.text('Version: ' + (d.version || 1), pw - m - 4, y + 13, { align: 'right' });
      if (EMPRESA.num_autorizacion) {
        doc.text('Aut: ' + EMPRESA.num_autorizacion, pw - m - 4, y + 18, { align: 'right' });
      }

      y += 27;

      // ========== HELPERS ==========
      const sectionTitle = (title) => {
        doc.setFillColor(...PRIMARY);
        doc.rect(m, y, cw, 7, 'F');
        doc.setTextColor(...WHITE);
        doc.setFontSize(9);
        doc.setFont('helvetica', 'bold');
        doc.text(title, m + 3, y + 5);
        doc.setTextColor(...DARK);
        doc.setFont('helvetica', 'normal');
        y += 10;
      };

      const row = (label, value, x, w) => {
        doc.setFontSize(7.5);
        doc.setTextColor(...GRAY);
        doc.text(label, x, y);
        doc.setFontSize(9.5);
        doc.setTextColor(...DARK);
        doc.setFont('helvetica', 'bold');
        doc.text(String(value || '--'), x, y + 4.5, { maxWidth: w || 75 });
        doc.setFont('helvetica', 'normal');
      };

      const col1 = m + 3;
      const col2 = m + cw / 2 + 2;
      const halfW = cw / 2 - 6;

      const fecha = d.fecha_transporte
        ? new Date(d.fecha_transporte).toLocaleDateString('es-ES', { day: '2-digit', month: 'long', year: 'numeric' })
        : '--';

      // ========== PARTES INTERVINIENTES ==========
      sectionTitle('PARTES INTERVINIENTES');

      doc.setFontSize(8);
      doc.setTextColor(...PRIMARY);
      doc.setFont('helvetica', 'bold');
      doc.text('Cargador contractual / Expedidor', col1, y);
      doc.setFont('helvetica', 'normal');
      y += 4;
      row('Nombre / Razon social', d.nombre_cargador, col1, halfW);
      row('NIF', d.nif_cargador, col2, halfW);
      y += 8;
      row('Direccion', d.direccion_cargador, col1, cw - 6);
      y += 10;

      doc.setFontSize(8);
      doc.setTextColor(...PRIMARY);
      doc.setFont('helvetica', 'bold');
      doc.text('Destinatario', col1, y);
      doc.setFont('helvetica', 'normal');
      y += 4;
      row('Nombre / Razon social', d.nombre_destinatario, col1, halfW);
      row('NIF', d.nif_destinatario, col2, halfW);
      y += 8;
      row('Direccion', d.direccion_destinatario, col1, cw - 6);
      y += 10;

      doc.setFontSize(8);
      doc.setTextColor(...PRIMARY);
      doc.setFont('helvetica', 'bold');
      doc.text('Transportista efectivo', col1, y);
      doc.setFont('helvetica', 'normal');
      y += 4;
      row('Nombre / Razon social', d.empresa, col1, halfW);
      row('NIF', d.nif_empresa, col2, halfW);
      y += 8;
      row('Direccion', EMPRESA.direccion, col1, halfW);
      row('N. autorizacion', d.num_autorizacion || '--', col2, halfW);
      y += 12;

      // ========== ENVIO ==========
      sectionTitle('ENVIO');

      row('Lugar de carga', d.origen, col1, halfW);
      row('Lugar de descarga', d.destino, col2, halfW);
      y += 8;
      row('Fecha de transporte', fecha, col1, halfW);
      row('Hora de carga', d.hora_carga || '--', col2, halfW);
      y += 8;
      row('Naturaleza de la mercancia', d.descripcion_mercancia, col1, cw - 6);
      y += 8;
      row('Peso (kg)', d.peso ? Number(d.peso).toLocaleString('es-ES') + ' kg' : '--', col1, halfW);
      row('Bultos', d.bultos || '--', col2, halfW);
      y += 8;
      row('N. expedicion', d.num_expedicion || d.referencia || '--', col1, halfW);
      y += 12;

      // ========== VEHICULO ==========
      sectionTitle('VEHICULO');

      row('Matricula vehiculo', d.matricula_vehiculo, col1, halfW);
      row('Matricula remolque', d.matricula_remolque || 'N/A', col2, halfW);
      y += 8;
      row('Conductor', d.nombre_conductor, col1, halfW);
      row('DNI / NIE', d.dni_conductor, col2, halfW);
      y += 14;

      // ========== QR ==========
      const qrUrl = d.qr_code || 'https://deca-manager.netlify.app/deca.html?ref=' + d.referencia;
      if (typeof QRious !== 'undefined') {
        try {
          const qr = new QRious({ value: qrUrl, size: 400, level: 'M' });
          const qrData = qr.toDataURL('image/png');
          const qrSize = 30;
          const qrX = pw / 2 - qrSize / 2;
          doc.addImage(qrData, 'PNG', qrX, y, qrSize, qrSize);
          doc.setFontSize(7);
          doc.setTextColor(...GRAY);
          doc.text('Escanear para verificar y descargar el documento', pw / 2, y + qrSize + 4, { align: 'center' });
          doc.text(qrUrl, pw / 2, y + qrSize + 8, { align: 'center' });
        } catch (e) { console.warn('QR error:', e); }
      }

      // ========== PIE ==========
      const footerY = 282;
      doc.setDrawColor(200, 200, 200);
      doc.line(m, footerY, pw - m, footerY);
      doc.setFontSize(7);
      doc.setTextColor(150, 150, 150);
      doc.text('Generado por DeCA Manager -- ' + new Date().toLocaleString('es-ES'), m, footerY + 4);
      doc.text('Ref: ' + d.referencia + ' | Conforme a Orden TRM/282/2026', pw - m, footerY + 4, { align: 'right' });

      // ========== DESCARGAR ==========
      doc.save((d.referencia || 'DeCA') + '.pdf');
    }

    // Iniciar automáticamente
    init();
  </script>
</body>
</html>
