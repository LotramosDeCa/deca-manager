<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a56db">
  <title>DeCA — Descarga</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #f3f4f6;
      color: #111827;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
      padding: 40px 32px;
      text-align: center;
      max-width: 380px;
      width: 90%;
    }
    .logo {
      width: 56px; height: 56px;
      margin: 0 auto 16px;
    }
    .logo rect { fill: #1a56db; }
    .logo path { fill: white; }
    h1 { font-size: 20px; font-weight: 700; color: #111827; margin-bottom: 4px; }
    .subtitle { font-size: 13px; color: #6b7280; margin-bottom: 24px; }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid #e5e7eb;
      border-top-color: #1a56db;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status { font-size: 14px; color: #374151; font-weight: 500; }
    .status-sub { font-size: 12px; color: #9ca3af; margin-top: 4px; }

    .success-icon {
      width: 48px; height: 48px;
      background: #d1fae5;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }
    .success-icon svg { color: #059669; }

    .error-icon {
      width: 48px; height: 48px;
      background: #fee2e2;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }
    .error-icon svg { color: #dc2626; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      margin-top: 16px;
      text-decoration: none;
    }
    .btn-primary { background: #1a56db; color: white; }
    .btn-primary:active { background: #1648b8; }

    .footer {
      margin-top: 24px;
      font-size: 11px;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="card" id="content">
    <svg class="logo" viewBox="0 0 56 56" fill="none">
      <rect width="56" height="56" rx="14"/>
      <path d="M16 18h24v4H16zM16 26h24v4H16zM16 34h16v4H16zM38 30l6 8h-12z"/>
    </svg>
    <h1>DeCA Manager</h1>
    <p class="subtitle">Documento Electrónico de Control Administrativo</p>
    <div class="spinner"></div>
    <p class="status">Generando documento...</p>
    <p class="status-sub">La descarga comenzará automáticamente</p>
  </div>
  <div class="footer">Conforme a Orden TRM/282/2026</div>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
  <!-- jsPDF -->
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <!-- QRious (generador QR para navegador) -->
  <script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>

  <script>
    const SUPABASE_URL = 'https://dzotgifxgjfvpprjffow.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR6b3RnaWZ4Z2pmdnBwcmpmZm93Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwMzY3MTMsImV4cCI6MjEwODYxMjcxM30.seS6dgC3qcLxqxzBDksbgAusPXMioV60rhhG3f5ScFk';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function init() {
      const params = new URLSearchParams(window.location.search);
      const ref = params.get('ref');
      const content = document.getElementById('content');

      if (!ref) {
        showError(content, 'No se ha proporcionado una referencia de DeCA.');
        return;
      }

      try {
        const { data, error } = await sb
          .from('decas')
          .select('*')
          .eq('referencia', ref)
          .single();

        if (error || !data) {
          showError(content, 'No se encontró la DeCA: ' + ref);
          return;
        }

        // Generar y descargar PDF automáticamente
        await generarYDescargarPDF(data);
        showSuccess(content, data.referencia);
      } catch (err) {
        console.error(err);
        showError(content, 'Error al generar el documento.');
      }
    }

    function showError(container, msg) {
      container.innerHTML = `
        <svg class="logo" viewBox="0 0 56 56" fill="none">
          <rect width="56" height="56" rx="14"/><path d="M16 18h24v4H16zM16 26h24v4H16zM16 34h16v4H16zM38 30l6 8h-12z"/>
        </svg>
        <h1>DeCA Manager</h1>
        <p class="subtitle">Documento Electrónico de Control Administrativo</p>
        <div class="error-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
          </svg>
        </div>
        <p class="status" style="color:#dc2626;">${msg}</p>
      `;
    }

    function showSuccess(container, referencia) {
      container.innerHTML = `
        <svg class="logo" viewBox="0 0 56 56" fill="none">
          <rect width="56" height="56" rx="14"/><path d="M16 18h24v4H16zM16 26h24v4H16zM16 34h16v4H16zM38 30l6 8h-12z"/>
        </svg>
        <h1>DeCA Manager</h1>
        <p class="subtitle">Documento Electrónico de Control Administrativo</p>
        <div class="success-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 6L9 17l-5-5"/>
          </svg>
        </div>
        <p class="status">Documento descargado</p>
        <p class="status-sub">${referencia}</p>
        <button class="btn btn-primary" onclick="init()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Descargar otra vez
        </button>
      `;
    }

    async function generarYDescargarPDF(d) {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF('p', 'mm', 'a4');
      const pageWidth = 210;
      const margin = 15;
      const contentWidth = pageWidth - margin * 2;
      let y = 15;

      // ===== CABECERA =====
      doc.setFillColor(26, 86, 219);
      doc.rect(0, 0, pageWidth, 32, 'F');
      doc.setTextColor(255, 255, 255);
      doc.setFontSize(18);
      doc.setFont('helvetica', 'bold');
      doc.text('DOCUMENTO ELECTRÓNICO DE CONTROL', pageWidth / 2, 14, { align: 'center' });
      doc.text('ADMINISTRATIVO (DeCA)', pageWidth / 2, 22, { align: 'center' });
      doc.setFontSize(10);
      doc.setFont('helvetica', 'normal');
      doc.text('Ref: ' + (d.referencia || '') + '  |  Versión: ' + (d.version || 1), pageWidth / 2, 29, { align: 'center' });

      y = 40;
      doc.setTextColor(0, 0, 0);

      // ===== QR =====
      const qrUrl = d.qr_code || `https://deca-manager.netlify.app/deca.html?ref=${d.referencia}`;
      if (typeof QRious !== 'undefined') {
        try {
          const qr = new QRious({ value: qrUrl, size: 300, level: 'M' });
          const qrData = qr.toDataURL('image/png');
          const qrSize = 40;
          doc.addImage(qrData, 'PNG', pageWidth - margin - qrSize, y, qrSize, qrSize);
          doc.setFontSize(7);
          doc.setTextColor(120, 120, 120);
          doc.text('Escanear para verificar', pageWidth - margin - qrSize / 2, y + qrSize + 4, { align: 'center' });
          doc.setTextColor(0, 0, 0);
        } catch (e) { console.warn('QR error:', e); }
      }

      // ===== HELPERS =====
      const sectionTitle = (title, posY) => {
        doc.setFillColor(240, 244, 255);
        doc.rect(margin, posY - 4, contentWidth, 7, 'F');
        doc.setFontSize(10);
        doc.setFont('helvetica', 'bold');
        doc.setTextColor(26, 86, 219);
        doc.text(title, margin + 2, posY);
        doc.setTextColor(0, 0, 0);
        doc.setFont('helvetica', 'normal');
        return posY + 10;
      };

      const field = (label, value, posY, x, maxW) => {
        doc.setFontSize(8);
        doc.setTextColor(120, 120, 120);
        doc.text(label, x, posY);
        doc.setFontSize(10);
        doc.setTextColor(0, 0, 0);
        doc.text(String(value || '—'), x, posY + 5, { maxWidth: maxW || 80 });
        return posY + 12;
      };

      const col1 = margin + 2;
      const col2 = margin + contentWidth / 2;

      const fecha = d.fecha_transporte
        ? new Date(d.fecha_transporte).toLocaleDateString('es-ES', { day: '2-digit', month: 'long', year: 'numeric' })
        : '—';

      // ===== DATOS DEL TRANSPORTE =====
      y = sectionTitle('DATOS DEL TRANSPORTE', y);
      field('Fecha de transporte', fecha, y, col1);
      field('N.º expedición', d.num_expedicion, y, col2);
      y += 12;
      field('Origen', d.origen, y, col1);
      field('Destino', d.destino, y, col2);
      y += 12;
      field('Descripción mercancía', d.descripcion_mercancia, y, col1, contentWidth - 4);
      y += 12;
      field('Peso (kg)', d.peso ? Number(d.peso).toLocaleString('es-ES') + ' kg' : '—', y, col1);
      field('Bultos', d.bultos, y, col2);
      y += 16;

      // ===== TRANSPORTISTA =====
      y = sectionTitle('DATOS DEL TRANSPORTISTA', y);
      field('Empresa', d.empresa, y, col1);
      field('NIF', d.nif_empresa, y, col2);
      y += 12;
      field('N.º autorización', d.num_autorizacion, y, col1);
      y += 16;

      // ===== CONDUCTOR =====
      y = sectionTitle('DATOS DEL CONDUCTOR', y);
      field('Nombre', d.nombre_conductor, y, col1);
      field('DNI', d.dni_conductor, y, col2);
      y += 16;

      // ===== VEHÍCULO =====
      y = sectionTitle('VEHÍCULO Y REMOLQUE', y);
      field('Matrícula vehículo', d.matricula_vehiculo, y, col1);
      field('Matrícula remolque', d.matricula_remolque || 'N/A', y, col2);
      y += 16;

      // ===== PIE =====
      const footerY = 280;
      doc.setDrawColor(200, 200, 200);
      doc.line(margin, footerY, pageWidth - margin, footerY);
      doc.setFontSize(7);
      doc.setTextColor(150, 150, 150);
      doc.text('Generado por DeCA Manager — ' + new Date().toLocaleString('es-ES'), margin, footerY + 4);
      doc.text('Ref: ' + d.referencia + ' | Conforme a Orden TRM/282/2026', pageWidth - margin, footerY + 4, { align: 'right' });

      // ===== DESCARGAR =====
      doc.save((d.referencia || 'DeCA') + '.pdf');
    }

    // Iniciar automáticamente
    init();
  </script>
</body>
</html>
